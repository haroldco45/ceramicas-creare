name: Robot de redes de Creare
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node robot/robot.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Guardar si hay cambios
        run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "robot@users.noreply.github.com"
          git add redes.json
          git diff --cached --quiet || (git commit -m "Robot: redes de Creare $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')" && git push)
